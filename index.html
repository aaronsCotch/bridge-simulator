<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suspension Bridge Expansion Simulation</title>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #17243a;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            color: #aabbd0;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 15px;
            padding: 15px;
        }

        #renderCanvas {
            width: 100%;
            height: 550px;
            display: block;
            border-radius: 12px;
            background: #26374d;
            touch-action: none;
        }

        .controls {
            background: #1c2a40;
            padding: 20px;
            border-radius: 12px;
        }

        .controls h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
        }

        select {
            background: #31445e;
            color: white;
        }

        input[type="range"] {
            width: 100%;
        }

        button {
            margin-top: 12px;
            cursor: pointer;
            background: #2585e8;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background: #1468c0;
        }

        .data {
            background: #26374d;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .data p {
            margin: 8px 0;
        }

        .status {
            color: #65d6a0;
            font-size: 13px;
        }

        @media(max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }

            #renderCanvas {
                height: 400px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Suspension Bridge Expansion Simulation</h1>
    <p>Physics 2 | Thermal Expansion and Contraction</p>
</header>

<div class="container">

    <canvas id="renderCanvas"></canvas>

    <div class="controls">

        <h2>Simulation Controls</h2>

        <label>Temperature</label>

        <input
            type="range"
            id="temperature"
            min="-20"
            max="60"
            value="20"
        >

        <h3>
            <span id="temperatureValue">20</span> °C
        </h3>

        <label>Bridge Material</label>

        <select id="material">
            <option value="0.000012">Steel</option>
            <option value="0.000023">Aluminum</option>
            <option value="0.000017">Copper</option>
            <option value="0.000010">Concrete</option>
        </select>

        <div class="data">

            <p>Expansion / Contraction:</p>
            <h2 id="expansion">0.00 mm</h2>

            <p>Temperature Change:</p>
            <h3 id="temperatureChange">0 °C</h3>

            <p>Joint
